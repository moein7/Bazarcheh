services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Ollama runs on the Mac host, not in this Compose project.
      # Docker Desktop for Mac resolves host.docker.internal automatically.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3-coder:30b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-35}
      URGENT_SLA_BUSINESS_HOURS: ${URGENT_SLA_BUSINESS_HOURS:-2}
      BAZARCHEH_DB_PATH: ${BAZARCHEH_DB_PATH:-/data/bazarcheh.db}

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
